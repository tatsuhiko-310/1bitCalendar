<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1bit Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=VT323&family=Space+Mono&family=Shippori+Mincho&family=Dela+Gothic+One&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --fg:#000000; --panel:#ffffff; --mute:#000000; --on-fg:#ffffff; --ink:#000000; --paper:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"DotGothic16","Hiragino Sans","Yu Gothic",monospace;
  font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}

header{ height:44px; display:flex; align-items:center; padding:0 14px; }
header h1{ margin:0; font-size:20px; font-weight:400; letter-spacing:.04em; }
.app{ display:block; }
.stage{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  height:52vh; height:52dvh;
  display:flex; flex-direction:column; gap:10px;
  background:var(--bg); padding:10px;
}
.cvbox{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
.seg.tools{ grid-template-columns:repeat(3,1fr); width:100%; max-width:420px; margin:0 auto; flex:none; }
#cv{
  display:block; touch-action:none; cursor:grab;
  border:2px solid var(--fg); box-shadow:4px 4px 0 var(--fg);
  background:var(--bg);
}
#cv.dragging{ cursor:grabbing; }

.panel{
  --fg:var(--paper); --bg:var(--ink); --panel:var(--ink); --mute:var(--paper); --on-fg:var(--ink);
  margin:6px 12px 24px; background:var(--ink); color:var(--fg);
  border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
}
.hint{ margin:0; padding:8px 12px; font-size:13px; color:var(--mute); border-bottom:2px solid var(--fg); }
#fs{ position:fixed; inset:0; z-index:60; background:var(--bg); display:none; cursor:pointer; }
#fs.open{ display:block; }
#fsCv{ width:100%; height:100%; object-fit:contain; display:block; }
#fsClose{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); right:10px; }
.tabs{ display:grid; grid-template-columns:repeat(4,1fr); border-bottom:2px solid var(--fg); }
.tabs button{
  font:inherit; color:var(--fg); background:transparent; border:0; border-right:2px solid var(--fg);
  min-height:44px; padding:6px 4px; cursor:pointer;
}
.tabs button:last-child{ border-right:0; }
.tabs button[aria-selected="true"]{ background:var(--fg); color:var(--on-fg); }
.pane{ padding:14px 12px 16px; display:grid; gap:14px; }
.pane[hidden]{ display:none; }

.row{ display:grid; gap:4px; }
.row .top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.row .val{ color:var(--mute); font-size:13px; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label.check{ display:flex; align-items:center; gap:10px; min-height:36px; cursor:pointer; }
/* スライダー・チェックは2色で描く(ブラウザ標準のグレーを出さない) */
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:28px; margin:2px 0; background:transparent; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track{ height:8px; border:2px solid var(--fg); background:var(--panel); }
input[type=range]::-moz-range-track{ height:4px; border:2px solid var(--fg); background:var(--panel); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:24px; margin-top:-10px; border:0; border-radius:0; background:var(--fg); }
input[type=range]::-moz-range-thumb{ width:20px; height:24px; border:0; border-radius:0; background:var(--fg); }
input[type=checkbox]{ -webkit-appearance:none; appearance:none; flex:none; width:20px; height:20px; margin:0; border:2px solid var(--fg); border-radius:0; background:var(--panel); cursor:pointer; }
input[type=checkbox]:checked{ background:var(--fg); box-shadow:inset 0 0 0 3px var(--panel); }
select{
  font:inherit; color:var(--fg); background:var(--panel);
  border:2px solid var(--fg); border-radius:0; padding:8px 10px; min-height:44px; width:100%;
}
.btn{
  font:inherit; color:var(--fg); background:var(--panel);
  border:2px solid var(--fg); border-radius:0; min-height:44px; padding:8px 14px; cursor:pointer;
  box-shadow:3px 3px 0 var(--fg);
}
.btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--fg); }
.btn.primary{ background:var(--fg); color:var(--on-fg); box-shadow:3px 3px 0 var(--mute); }
.btn.wide{ width:100%; }
button:focus-visible,select:focus-visible,input:focus-visible{ outline:3px dashed var(--fg); outline-offset:2px; }

.monthbar{ display:grid; grid-template-columns:48px 1fr 48px; gap:8px; align-items:center; }
.monthbar .lbl{ text-align:center; font-size:17px; }
.swatches{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sw{
  font:inherit; font-size:13px; color:var(--fg); background:var(--panel);
  min-height:44px; border:2px solid var(--fg); border-radius:0; cursor:pointer; padding:4px;
  box-shadow:2px 2px 0 var(--fg); white-space:nowrap;
}
.sw[aria-pressed="true"]{ background:var(--fg); color:var(--on-fg); }
.sw:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 var(--fg); }
.note{ margin:0; font-size:13px; color:var(--mute); }
.sec{ display:block; border-bottom:2px solid var(--fg); padding-bottom:4px; margin-top:6px; }
.seg{ display:grid; grid-template-columns:1fr 1fr; border:2px solid var(--fg); }
.seg button{ font:inherit; color:var(--fg); background:var(--panel); border:0; min-height:40px; cursor:pointer; }
.seg button + button{ border-left:2px solid var(--fg); }
.seg button[aria-pressed="true"]{ background:var(--fg); color:var(--on-fg); }

#crop{ position:fixed; inset:0; z-index:70; background:var(--bg); color:var(--fg); display:none; flex-direction:column; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px); }
#crop.open{ display:flex; }
#cropAsp{ grid-template-columns:repeat(5,1fr); }
.cropstage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
#cropCv{ display:block; touch-action:none; outline:2px solid var(--fg); background:var(--bg); }
.cropbtns{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

#msg{ min-height:1.5em; font-size:13px; margin:0; }

#overlay{
  position:fixed; inset:0; z-index:50; background:var(--bg);
  display:none; align-items:center; justify-content:center; padding:16px; overflow:auto;
}
#overlay.open{ display:flex; }
#overlay .card{
  background:var(--panel); color:var(--fg); border:2px solid var(--fg); box-shadow:4px 4px 0 var(--fg);
  padding:14px; max-width:min(420px,100%); display:grid; gap:10px;
}
#overlay img{ width:100%; height:auto; display:block; border:2px solid var(--fg); max-height:60vh; object-fit:contain; }

@media (min-width:860px){
  .app{ display:grid; grid-template-columns:minmax(0,1fr) 400px; align-items:center; gap:8px; padding-right:12px; }
  .stage{ height:calc(100vh - 44px); height:calc(100dvh - 44px); }
  .panel{ margin:0; align-self:center; max-height:calc(100vh - 68px); max-height:calc(100dvh - 68px); overflow-y:auto; }
}
</style>
</head>
<body>
<header><h1>1bit Calendar</h1></header>

<main class="app">
  <section class="stage" id="stage" aria-label="プレビュー">
    <div class="cvbox" id="cvbox"><canvas id="cv" width="1179" height="2556" role="img" aria-label="壁紙のプレビュー。ドラッグで写真やカレンダーを動かせます"></canvas></div>
    <div class="seg tools">
      <button type="button" id="guide" aria-pressed="false">ガイド</button>
      <button type="button" id="snap" aria-pressed="true">スナップ</button>
      <button type="button" id="fsOpen">全画面</button>
    </div>
  </section>

  <section class="panel">
    <p class="hint">カレンダーの上をドラッグするとカレンダー、それ以外は写真が動きます。2本指でも拡大できます。</p>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-photo" aria-selected="true" aria-controls="pane-photo" data-tab="photo">写真</button>
      <button role="tab" id="t-cal" aria-selected="false" aria-controls="pane-cal" data-tab="cal">カレンダー</button>
      <button role="tab" id="t-color" aria-selected="false" aria-controls="pane-color" data-tab="color">色</button>
      <button role="tab" id="t-out" aria-selected="false" aria-controls="pane-out" data-tab="out">出力</button>
    </div>

    <!-- 写真 -->
    <div class="pane" id="pane-photo" role="tabpanel" aria-labelledby="t-photo">
      <div>
        <input type="file" id="file" accept="image/*" hidden>
        <button class="btn primary wide" id="pick" type="button">写真を選ぶ</button>
      </div>
      <div class="two">
        <button class="btn" id="cropOpen" type="button">トリミング</button>
        <button class="btn" id="cropReset" type="button">トリミング解除</button>
      </div>
      <div class="row">
        <label for="algo">ディザの方式</label>
        <select id="algo">
          <option value="b2">ベイヤー 2×2</option>
          <option value="b4" selected>ベイヤー 4×4</option>
          <option value="b8">ベイヤー 8×8</option>
          <option value="fs">フロイド・スタインバーグ</option>
          <option value="at">アトキンソン</option>
          <option value="th">しきい値(2値化)</option>
        </select>
      </div>
      <div class="row">
        <div class="top"><label for="px">ドットの大きさ</label><span class="val" id="v-px"></span></div>
        <input type="range" id="px" min="1" max="16" step="1">
      </div>
      <div class="row">
        <div class="top"><label for="bright">明るさ</label><span class="val" id="v-bright"></span></div>
        <input type="range" id="bright" min="-100" max="100" step="1">
      </div>
      <div class="row">
        <div class="top"><label for="contrast">コントラスト</label><span class="val" id="v-contrast"></span></div>
        <input type="range" id="contrast" min="-100" max="100" step="1">
      </div>
      <div class="row">
        <div class="top"><label for="pscale">写真の大きさ</label><span class="val" id="v-pscale"></span></div>
        <input type="range" id="pscale" min="0.2" max="4" step="0.01">
      </div>
      <label class="check"><input type="checkbox" id="invert">明暗を反転する</label>
      <button class="btn wide" id="resetPhoto" type="button">写真の位置をもどす</button>
    </div>

    <!-- カレンダー -->
    <div class="pane" id="pane-cal" role="tabpanel" aria-labelledby="t-cal" hidden>
      <label class="check"><input type="checkbox" id="calShow">カレンダーを表示する</label>
      <div class="monthbar">
        <button class="btn" id="prevM" type="button" aria-label="前の月">&lt;</button>
        <div class="lbl" id="monthLabel" aria-live="polite"></div>
        <button class="btn" id="nextM" type="button" aria-label="次の月">&gt;</button>
      </div>
      <button class="btn wide" id="thisM" type="button">今月にする</button>
      <div class="row">
        <label for="calStyle">スタイル</label>
        <select id="calStyle">
          <option value="grid">グリッド</option>
          <option value="list">縦リスト</option>
          <option value="list2">2列リスト</option>
          <option value="transpose">縦横入れ替え</option>
          <option value="bigmonth">ビッグ月</option>
          <option value="strip">1行</option>
          <option value="plain">数字のみ</option>
        </select>
      </div>
      <div class="row">
        <label for="calFont">フォント</label>
        <select id="calFont">
          <option value="DotGothic16">ドット(ドットゴシック)</option>
          <option value="Press Start 2P">ピクセル(英数字)</option>
          <option value="VT323">ターミナル</option>
          <option value="Space Mono">等幅</option>
          <option value="Shippori Mincho">明朝</option>
          <option value="Dela Gothic One">極太ゴシック</option>
          <option value="Yusei Magic">手書き</option>
        </select>
      </div>
      <div class="two">
        <div class="row">
          <label for="calWeek">週の始まり</label>
          <select id="calWeek"><option value="0">日曜</option><option value="1">月曜</option></select>
        </div>
        <div class="row">
          <label for="calLang">言語</label>
          <select id="calLang"><option value="ja">日本語</option><option value="en">English</option></select>
        </div>
      </div>
      <div class="row">
        <div class="top"><label for="calSize">カレンダーの大きさ</label><span class="val" id="v-calSize"></span></div>
        <input type="range" id="calSize" min="0.4" max="2.5" step="0.01">
      </div>
      <label class="check"><input type="checkbox" id="calFrame">枠をつける</label>
      <label class="check"><input type="checkbox" id="calBg">背景をつける</label>
      <button class="btn wide" id="resetCal" type="button">カレンダーの位置をもどす</button>
    </div>

    <!-- 色 -->
    <div class="pane" id="pane-color" role="tabpanel" aria-labelledby="t-color" hidden>
      <div class="seg" id="colorTarget" role="group" aria-label="調整する色">
        <button type="button" data-c="ink" aria-pressed="true">ドットの色</button>
        <button type="button" data-c="paper" aria-pressed="false">背景の色</button>
      </div>
      <div class="row">
        <div class="top"><label for="hue">色相</label><span class="val" id="v-hue"></span></div>
        <input type="range" id="hue" min="0" max="359" step="1">
      </div>
      <div class="row">
        <div class="top"><label for="sat">鮮やかさ</label><span class="val" id="v-sat"></span></div>
        <input type="range" id="sat" min="0" max="100" step="1">
      </div>
      <div class="row">
        <div class="top"><label for="lit">明るさ</label><span class="val" id="v-lit"></span></div>
        <input type="range" id="lit" min="0" max="100" step="1">
      </div>
      <button class="btn wide" id="swapColors" type="button">色を反転</button>
      <div class="row">
        <span class="sec">テンプレート</span>
        <div class="swatches" id="swatches"></div>
      </div>
    </div>

    <!-- 出力 -->
    <div class="pane" id="pane-out" role="tabpanel" aria-labelledby="t-out" hidden>
      <div class="row">
        <label for="size">画像のサイズ</label>
        <select id="size">
          <option value="1179x2556">iPhone(1179×2556)</option>
          <option value="1290x2796">iPhone Pro Max(1290×2796)</option>
          <option value="1080x2400">Android(1080×2400)</option>
          <option value="1640x2360">iPad(1640×2360)</option>
          <option value="1920x1080">PC(1920×1080)</option>
          <option value="1080x1080">正方形(1080×1080)</option>
        </select>
      </div>
      <button class="btn primary wide" id="save" type="button">PNGで保存する</button>
      <p id="msg" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<div id="crop" role="dialog" aria-modal="true" aria-label="写真をトリミング">
  <div class="seg" id="cropAsp" role="group" aria-label="縦横比">
    <button type="button" data-asp="free" aria-pressed="true">自由</button>
    <button type="button" data-asp="1" aria-pressed="false">1:1</button>
    <button type="button" data-asp="0.75" aria-pressed="false">3:4</button>
    <button type="button" data-asp="0.5625" aria-pressed="false">9:16</button>
    <button type="button" data-asp="screen" aria-pressed="false">画面</button>
  </div>
  <div class="cropstage" id="cropStage"><canvas id="cropCv"></canvas></div>
  <div class="cropbtns">
    <button class="btn" id="cropCancel" type="button">キャンセル</button>
    <button class="btn" id="cropFull" type="button">全体</button>
    <button class="btn primary" id="cropApply" type="button">適用</button>
  </div>
</div>

<div id="fs" role="dialog" aria-modal="true" aria-label="壁紙の全画面表示">
  <canvas id="fsCv"></canvas>
  <button class="btn" id="fsClose" type="button">閉じる</button>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="画像を保存">
  <div class="card">
    <img id="outImg" alt="書き出した壁紙">
    <p class="note">画像を長押し(PCは右クリック)して保存できます。</p>
    <button class="btn wide" id="closeOv" type="button">閉じる</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const lo = document.createElement('canvas'), lctx = lo.getContext('2d', { willReadFrequently: true });
const out = document.createElement('canvas'), octx = out.getContext('2d');
const FONT = '"DotGothic16","Hiragino Sans","Yu Gothic",monospace';
const now = new Date();

const S = {
  W: 1179, H: 2556,
  src: null,
  photo: { x: .5, y: .36, scale: 1 },
  dither: { algo: 'b4', px: 4, bright: 0, contrast: 0, invert: false },
  cal: { show: true, x: .5, y: .74, size: 1, year: now.getFullYear(), month: now.getMonth(),
         style: 'grid', weekStart: 0, lang: 'ja', font: 'DotGothic16', frame: true, bg: true },
  color: { ink: '#000000', paper: '#ffffff' },
  hsl: { ink: [0, 0, 0], paper: [0, 0, 100] }, colorTarget: 'ink',
  guide: false, snap: true,
  calBox: null
};

const PRESETS = [
  ['モノクロ', '#000000', '#ffffff'],
  ['反転',     '#ffffff', '#000000'],
  ['ターミナル', '#33ff66', '#04140a'],
  ['アンバー', '#ffb000', '#1a1000'],
  ['ブルー',   '#1b2cc1', '#e8ecff'],
  ['レッド',   '#e0242b', '#ffffff'],
  ['ミント',   '#0b3d3a', '#d9fff0'],
  ['ピンク',   '#ff2e88', '#1b0a14']
];

const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

/* ---------- ベイヤー行列 ---------- */
function bayerMatrix(n) {
  let m = [[0]];
  while (m.length < n) {
    const s = m.length, nm = [];
    for (let y = 0; y < 2 * s; y++) {
      nm[y] = [];
      for (let x = 0; x < 2 * s; x++) {
        const q = (y < s ? 0 : 2) + (x < s ? 0 : 1);
        nm[y][x] = 4 * m[y % s][x % s] + [0, 2, 3, 1][q];
      }
    }
    m = nm;
  }
  return m;
}
const MAT = { b2: bayerMatrix(2), b4: bayerMatrix(4), b8: bayerMatrix(8) };

/* ---------- サンプル画像 ---------- */
function makeSample() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1600;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 1600);
  sky.addColorStop(0, '#000'); sky.addColorStop(.6, '#d8d8d8'); sky.addColorStop(1, '#fff');
  g.fillStyle = sky; g.fillRect(0, 0, 1200, 1600);
  const sun = g.createRadialGradient(600, 700, 0, 600, 700, 300);
  sun.addColorStop(0, 'rgba(255,255,255,1)'); sun.addColorStop(.7, 'rgba(255,255,255,1)'); sun.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sun; g.beginPath(); g.arc(600, 700, 300, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#4a4a4a'; g.beginPath(); g.moveTo(0, 1150);
  g.quadraticCurveTo(300, 980, 600, 1110); g.quadraticCurveTo(900, 1230, 1200, 1060);
  g.lineTo(1200, 1600); g.lineTo(0, 1600); g.closePath(); g.fill();
  g.fillStyle = '#0c0c0c'; g.beginPath(); g.moveTo(0, 1350);
  g.quadraticCurveTo(400, 1210, 800, 1330); g.quadraticCurveTo(1000, 1380, 1200, 1300);
  g.lineTo(1200, 1600); g.lineTo(0, 1600); g.closePath(); g.fill();
  return c;
}

/* ---------- 2色の点線(ドットの色と背景の色が交互) ---------- */
function dashLine(g, lw, dash, path) {
  g.save(); g.lineWidth = lw;
  g.setLineDash([]); g.strokeStyle = S.color.paper; path(); g.stroke();
  g.setLineDash(dash); g.strokeStyle = S.color.ink; path(); g.stroke();
  g.restore();
}

/* ---------- 写真のディザ ---------- */
function renderPhoto() {
  const px = S.dither.px, lw = Math.ceil(S.W / px), lh = Math.ceil(S.H / px);
  if (lo.width !== lw || lo.height !== lh) { lo.width = lw; lo.height = lh; out.width = lw; out.height = lh; }
  else lctx.clearRect(0, 0, lw, lh);
  const src = S.src;
  const dw = S.W * S.photo.scale / px, dh = dw * src.height / src.width;
  lctx.imageSmoothingEnabled = true; lctx.imageSmoothingQuality = 'high';
  lctx.drawImage(src, S.photo.x * lw - dw / 2, S.photo.y * lh - dh / 2, dw, dh);
  const d = lctx.getImageData(0, 0, lw, lh).data, n = lw * lh, g = new Float32Array(n);
  const f = 1 + S.dither.contrast / 100, b = S.dither.bright * 2.55;
  for (let i = 0; i < n; i++) {
    const k = i * 4;
    if (d[k + 3] < 128) { g[i] = 255; continue; }
    let v = .299 * d[k] + .587 * d[k + 1] + .114 * d[k + 2];
    v = (v - 128) * f + 128 + b;
    if (S.dither.invert) v = 255 - v;
    g[i] = v < 0 ? 0 : v > 255 ? 255 : v;
  }
  const bits = new Uint8Array(n); // 1 = 地, 0 = ドット
  const a = S.dither.algo;
  if (a[0] === 'b') {
    const m = MAT[a], s = m.length, s2 = s * s;
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
      const i = y * lw + x;
      bits[i] = g[i] > (m[y % s][x % s] + .5) / s2 * 255 ? 1 : 0;
    }
  } else if (a === 'th') {
    for (let i = 0; i < n; i++) bits[i] = g[i] >= 128 ? 1 : 0;
  } else {
    const spread = a === 'fs'
      ? [[1, 0, 7 / 16], [-1, 1, 3 / 16], [0, 1, 5 / 16], [1, 1, 1 / 16]]
      : [[1, 0, 1 / 8], [2, 0, 1 / 8], [-1, 1, 1 / 8], [0, 1, 1 / 8], [1, 1, 1 / 8], [0, 2, 1 / 8]];
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
      const i = y * lw + x, old = g[i], nv = old < 128 ? 0 : 255, err = old - nv;
      bits[i] = nv ? 1 : 0;
      for (let j = 0; j < spread.length; j++) {
        const sx = x + spread[j][0], sy = y + spread[j][1];
        if (sx < 0 || sx >= lw || sy >= lh) continue;
        g[sy * lw + sx] += err * spread[j][2];
      }
    }
  }
  const oid = octx.createImageData(lw, lh), o = oid.data, c = hex(S.color.ink);
  for (let i = 0; i < n; i++) if (!bits[i]) { const k = i * 4; o[k] = c[0]; o[k + 1] = c[1]; o[k + 2] = c[2]; o[k + 3] = 255; }
  octx.putImageData(oid, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(out, 0, 0, lw * px, lh * px);
}

/* ---------- カレンダー ---------- */
const WJ = ['日', '月', '火', '水', '木', '金', '土'];
const WE = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const WL = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

// フォントごとの文字幅の補正
const FK = { 'DotGothic16': 1, 'Press Start 2P': .6, 'VT323': 1.2, 'Space Mono': .9, 'Shippori Mincho': 1, 'Dela Gothic One': .8, 'Yusei Magic': 1 };
// スタイルごとの基準文字サイズ(出力幅に対する比)
const CAL_F = { grid: .034, list: .026, list2: .026, transpose: .03, bigmonth: .03, strip: .018, plain: .034 };

function drawCal(guides) {
  const c = S.cal, st = c.style, ja = c.lang === 'ja';
  const days = new Date(c.year, c.month + 1, 0).getDate();
  const first = new Date(c.year, c.month, 1).getDay();
  const off = (first - c.weekStart + 7) % 7;
  const f = S.W * (CAL_F[st] || .03) * c.size;
  const cf = s => `${s * (FK[c.font] || 1)}px "${c.font}", ${FONT}`;
  const wk = i => (ja ? WJ : WE)[(i + c.weekStart) % 7];
  const col = S.color.ink, paper = S.color.paper;
  const pad = (c.frame || c.bg) ? f * .9 : 0;
  const rule = Math.max(2, Math.round(f * .1)), thin = Math.max(1, Math.round(rule / 2));
  const dot = Math.max(2, Math.round(f * .1));

  // 大きさ
  let w, h, cw, ch, rows, titleH = f * 2.5;
  if (st === 'grid') { cw = f * 2.1; ch = f * 1.7; rows = Math.ceil((off + days) / 7); w = cw * 7; h = titleH + ch * (rows + 1); }
  else if (st === 'list') { ch = f * 1.35; w = f * 10.5; h = titleH + ch * days; }
  else if (st === 'list2') { rows = Math.ceil(days / 2); ch = f * 1.35; cw = f * 8.2; w = cw * 2 + f * 1.6; h = titleH + ch * rows; }
  else if (st === 'transpose') { rows = Math.ceil((off + days) / 7); cw = f * 2; ch = f * 1.7; w = Math.max(f * 11, f * 2.4 + cw * rows); h = titleH + ch * 7; }
  else if (st === 'bigmonth') { titleH = f * 6.4; cw = f * 2.1; ch = f * 1.7; rows = Math.ceil((off + days) / 7); w = cw * 7; h = titleH + ch * (rows + 1); }
  else if (st === 'strip') { titleH = f * 2.6; cw = f * 1.55; ch = f * 1.7; w = cw * days; h = titleH + ch * 2; }
  else { cw = f * 2.1; ch = f * 1.7; rows = Math.ceil((off + days) / 7); w = cw * 7; h = ch * rows; }

  // 位置・背景・枠
  const bw = w + 2 * pad, bh = h + 2 * pad, sh = Math.round(f * .3);
  clampCalPos(bw, bh, c.frame ? f * .3 : 0);
  const bx = c.x * S.W - bw / 2, by = c.y * S.H - bh / 2;
  S.calBox = { x: bx, y: by, w: bw + f * .3, h: bh + f * .3 };
  S.calRect = { x: bx, y: by, w: bw, h: bh };
  if (c.bg) { ctx.fillStyle = paper; ctx.fillRect(bx, by, bw, bh); }
  if (c.frame) {
    const lwf = Math.max(2, Math.round(f * .09));
    ctx.fillStyle = col;
    ctx.fillRect(bx + bw, by + sh, sh, bh);
    ctx.fillRect(bx + sh, by + bh, bw - sh, sh);
    ctx.strokeStyle = col; ctx.lineWidth = lwf;
    ctx.strokeRect(bx + lwf / 2, by + lwf / 2, bw - lwf, bh - lwf);
  }
  const ox = bx + pad, oy = by + pad;
  ctx.fillStyle = col; ctx.textBaseline = 'middle';

  // 部品
  const title = sz => {
    ctx.textAlign = 'left'; ctx.font = cf(f * sz); ctx.fillText(ja ? (c.month + 1) + '月' : MONTHS[c.month], ox, oy + titleH * .42);
    ctx.textAlign = 'right'; ctx.font = cf(f); ctx.fillText(String(c.year), ox + w, oy + titleH * .5);
    ctx.fillRect(ox, oy + titleH * .84, w, rule);
  };
  const gridAt = (gy, head) => {
    let top = gy;
    if (head) {
      ctx.textAlign = 'center'; ctx.font = cf(f * .95);
      for (let i = 0; i < 7; i++) ctx.fillText(wk(i), ox + cw * (i + .5), gy + ch * .5);
      ctx.fillRect(ox, gy + ch * .98, w, thin);
      top = gy + ch;
    }
    ctx.textAlign = 'center'; ctx.font = cf(f * 1.15);
    for (let d = 1; d <= days; d++) {
      const idx = off + d - 1;
      ctx.fillText(String(d), ox + cw * ((idx % 7) + .5), top + ch * (Math.floor(idx / 7) + .5));
    }
  };
  // 日付・点線・曜日の1行(リスト系)。l/r は点線の左右の余白、inset は文字の余白
  const listRow = (d, x0, rw, cy, l, r, inset) => {
    const dow = (first + d - 1) % 7;
    for (let x = x0 + f * l; x < x0 + rw - f * r; x += f * .4) ctx.fillRect(Math.round(x), Math.round(cy + f * .15), dot, dot);
    ctx.textAlign = 'left'; ctx.fillText(String(d).padStart(2, '0'), x0 + f * inset, cy);
    ctx.textAlign = 'right'; ctx.fillText(ja ? WJ[dow] : WL[dow], x0 + rw - f * inset, cy);
  };

  if (st === 'grid') {
    title(1.7);
    gridAt(oy + titleH, true);
  } else if (st === 'list') {
    title(1.3);
    ctx.font = cf(f);
    for (let d = 1; d <= days; d++) listRow(d, ox, w, oy + titleH + ch * (d - .5), 2.6, 3.4, .4);
  } else if (st === 'list2') {
    title(1.5);
    ctx.font = cf(f);
    for (let d = 1; d <= days; d++) {
      const idx = d - 1, colI = idx >= rows ? 1 : 0;
      listRow(d, ox + colI * (cw + f * 1.6), cw, oy + titleH + ch * (idx % rows + .5), 2.4, 2.6, .2);
    }
  } else if (st === 'transpose') {
    title(1.5);
    const lw0 = f * 2.4, gy = oy + titleH;
    ctx.textAlign = 'center'; ctx.font = cf(f * .95);
    for (let i = 0; i < 7; i++) ctx.fillText(wk(i), ox + lw0 / 2, gy + ch * (i + .5));
    ctx.fillRect(ox + lw0 - thin, gy, thin, ch * 7);
    ctx.font = cf(f * 1.15);
    for (let d = 1; d <= days; d++) {
      const idx = off + d - 1;
      ctx.fillText(String(d), ox + lw0 + cw * (Math.floor(idx / 7) + .5), gy + ch * ((idx % 7) + .5));
    }
  } else if (st === 'bigmonth') {
    ctx.textAlign = 'left'; ctx.font = cf(f * 6.2); ctx.fillText(String(c.month + 1), ox, oy + titleH * .45);
    ctx.textAlign = 'right'; ctx.font = cf(f * 1.1);
    ctx.fillText(String(c.year), ox + w, oy + titleH * .28);
    ctx.fillText(MONTHS[c.month].slice(0, 3), ox + w, oy + titleH * .5);
    ctx.fillRect(ox, oy + titleH * .9, w, rule);
    gridAt(oy + titleH, true);
  } else if (st === 'strip') {
    title(1.7);
    const gy = oy + titleH;
    ctx.textAlign = 'center'; ctx.font = cf(f * .9);
    for (let d = 1; d <= days; d++) ctx.fillText((ja ? WJ : WE)[(first + d - 1) % 7], ox + cw * (d - .5), gy + ch * .5);
    ctx.fillRect(ox, gy + ch * .98, w, thin);
    ctx.font = cf(f);
    for (let d = 1; d <= days; d++) ctx.fillText(String(d), ox + cw * (d - .5), gy + ch * 1.5);
  } else {
    gridAt(oy, false);
  }

  if (guides) {
    const dl = Math.max(6, f * .35);
    dashLine(ctx, Math.max(3, f * .1), [dl, dl], () => { ctx.beginPath(); ctx.rect(bx - f * .3, by - f * .3, bw + f * .9, bh + f * .9); });
  }
}

/* ---------- 描画 ---------- */
// preview=true のときだけガイド類を重ねる(保存・全画面は false)
let dragging = false, snapG = { xs: [], ys: [] };
function render(preview) {
  ctx.fillStyle = S.color.paper; ctx.fillRect(0, 0, S.W, S.H);
  renderPhoto();
  if (S.cal.show) drawCal(preview && dragging && target === 'cal'); else { S.calBox = null; S.calRect = null; }
  if (!preview) return;
  const u = S.W / (cv.clientWidth || S.W); // 画面上の1pxに当たる出力px
  const lines = (xs, ys, lw) => dashLine(ctx, lw, [u * 6, u * 4], () => {
    ctx.beginPath();
    xs.forEach(x => { ctx.moveTo(x, 0); ctx.lineTo(x, S.H); });
    ys.forEach(y => { ctx.moveTo(0, y); ctx.lineTo(S.W, y); });
  });
  if (S.guide) lines([S.W / 2], [S.H / 2], u);
  if (dragging && (snapG.xs.length || snapG.ys.length)) lines(snapG.xs, snapG.ys, u * 2);
}
// 保存・全画面用の画像(ガイドなし)
function finalImage() {
  render(false);
  const c = document.createElement('canvas'); c.width = S.W; c.height = S.H;
  c.getContext('2d').drawImage(cv, 0, 0);
  schedule();
  return c;
}
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(true); }); }

function fit() {
  const st = $('#cvbox').getBoundingClientRect();
  const aw = Math.max(50, st.width - 8), ah = Math.max(50, st.height - 8);
  const k = Math.min(aw / S.W, ah / S.H);
  cv.style.width = Math.floor(S.W * k) + 'px';
  cv.style.height = Math.floor(S.H * k) + 'px';
}

/* ---------- UI の同期 ---------- */
const MONTH_JA = m => (m + 1) + '月';
function syncUI() {
  $('#algo').value = S.dither.algo;
  $('#px').value = S.dither.px; $('#v-px').textContent = S.dither.px + 'px';
  $('#bright').value = S.dither.bright; $('#v-bright').textContent = S.dither.bright;
  $('#contrast').value = S.dither.contrast; $('#v-contrast').textContent = S.dither.contrast;
  $('#pscale').value = S.photo.scale; $('#v-pscale').textContent = '×' + S.photo.scale.toFixed(2);
  $('#invert').checked = S.dither.invert;
  $('#calShow').checked = S.cal.show;
  $('#monthLabel').textContent = S.cal.year + '年' + MONTH_JA(S.cal.month);
  $('#calStyle').value = S.cal.style; $('#calWeek').value = String(S.cal.weekStart); $('#calLang').value = S.cal.lang;
  $('#calSize').value = S.cal.size; $('#v-calSize').textContent = '×' + S.cal.size.toFixed(2);
  $('#calFont').value = S.cal.font; $('#calFrame').checked = S.cal.frame; $('#calBg').checked = S.cal.bg;
  $('#guide').setAttribute('aria-pressed', String(S.guide)); $('#snap').setAttribute('aria-pressed', String(S.snap));
  const hsl = S.hsl[S.colorTarget];
  $('#hue').value = hsl[0]; $('#v-hue').textContent = hsl[0];
  $('#sat').value = hsl[1]; $('#v-sat').textContent = hsl[1];
  $('#lit').value = hsl[2]; $('#v-lit').textContent = hsl[2];
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ink === S.color.ink && b.dataset.paper === S.color.paper)));
  document.querySelectorAll('#colorTarget button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === S.colorTarget)));
  $('#size').value = S.W + 'x' + S.H;
  applyTheme();
}

function autoPlace() {
  S.photo.scale = 1;
  const dh = S.W * S.src.height / S.src.width;
  S.photo.x = .5;
  S.photo.y = Math.min(.5, dh / 2 / S.H + .04);
}

/* ---------- 入力の配線 ---------- */
const bindInput = (id, fn, ev = 'input') => $(id).addEventListener(ev, e => { fn(e.target); syncUI(); schedule(); });
bindInput('#algo', t => S.dither.algo = t.value, 'change');
bindInput('#px', t => S.dither.px = +t.value);
bindInput('#bright', t => S.dither.bright = +t.value);
bindInput('#contrast', t => S.dither.contrast = +t.value);
bindInput('#pscale', t => S.photo.scale = +t.value);
bindInput('#invert', t => S.dither.invert = t.checked, 'change');
bindInput('#calShow', t => S.cal.show = t.checked, 'change');
bindInput('#calStyle', t => S.cal.style = t.value, 'change');
bindInput('#calWeek', t => S.cal.weekStart = +t.value, 'change');
bindInput('#calLang', t => S.cal.lang = t.value, 'change');
bindInput('#calSize', t => S.cal.size = +t.value);
bindInput('#calFrame', t => S.cal.frame = t.checked, 'change');
bindInput('#calBg', t => S.cal.bg = t.checked, 'change');
$('#guide').addEventListener('click', () => { S.guide = !S.guide; syncUI(); schedule(); });
$('#snap').addEventListener('click', () => { S.snap = !S.snap; syncUI(); schedule(); });
$('#calFont').addEventListener('change', async e => {
  S.cal.font = e.target.value; schedule();
  try { await document.fonts.load(`16px "${S.cal.font}"`, '0123456789年月日火水木金土SMTWFJANUARYBCDEGHILOPRV'); } catch (_) {}
  schedule();
});
// 色: スライダー(HSL)で調整。色相を保つため HSL を別に持つ
const toHSL = h => { const [r, g, b] = hex(h); return rgb2hsl(r, g, b).map(Math.round); };
function setColors(ink, paper) {
  S.color.ink = ink; S.color.paper = paper;
  S.hsl = { ink: toHSL(ink), paper: toHSL(paper) };
}
['#hue', '#sat', '#lit'].forEach((id, i) => bindInput(id, t => {
  const c = S.colorTarget, hsl = S.hsl[c];
  hsl[i] = +t.value;
  S.color[c] = toHex(hsl2rgb(hsl[0], hsl[1], hsl[2]));
}));
document.querySelectorAll('#colorTarget button').forEach(b => b.addEventListener('click', () => { S.colorTarget = b.dataset.c; syncUI(); }));

function shiftMonth(delta) {
  const d = new Date(S.cal.year, S.cal.month + delta, 1);
  S.cal.year = d.getFullYear(); S.cal.month = d.getMonth(); syncUI(); schedule();
}
$('#prevM').addEventListener('click', () => shiftMonth(-1));
$('#nextM').addEventListener('click', () => shiftMonth(1));
$('#thisM').addEventListener('click', () => { S.cal.year = now.getFullYear(); S.cal.month = now.getMonth(); syncUI(); schedule(); });
$('#resetCal').addEventListener('click', () => { S.cal.x = .5; S.cal.y = .74; S.cal.size = 1; syncUI(); schedule(); });
$('#resetPhoto').addEventListener('click', () => { autoPlace(); syncUI(); schedule(); });

$('#size').addEventListener('change', e => {
  const [w, h] = e.target.value.split('x').map(Number);
  S.W = w; S.H = h; cv.width = w; cv.height = h;
  if (w > h) { S.photo.y = .5; S.cal.y = .5; S.cal.x = .75; S.cal.size = .8; }
  fit(); syncUI(); schedule();
});

// 配色
const sws = $('#swatches');
PRESETS.forEach(([name, ink, paper]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sw'; b.title = name; b.setAttribute('aria-label', '配色: ' + name);
  b.textContent = (ink + '×' + paper).toUpperCase(); b.dataset.ink = ink; b.dataset.paper = paper;
  b.addEventListener('click', () => { setColors(ink, paper); syncUI(); schedule(); });
  sws.appendChild(b);
});

// タブ
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  document.querySelectorAll('.pane').forEach(p => p.hidden = p.id !== 'pane-' + b.dataset.tab);
}));

// 写真の読み込み
const msg = $('#msg');
$('#pick').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onerror = () => { msg.textContent = '写真を読み込めませんでした。'; };
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => { msg.textContent = '写真を読み込めませんでした。JPEG・PNG・WebPを選んでください。'; };
    im.onload = () => {
      const k = Math.min(1, 2400 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      S.src = c; S.orig = c; S.crop = null; autoPlace(); syncUI(); schedule(); msg.textContent = '';
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
  e.target.value = '';
});

/* ---------- ドラッグ・ピンチ・ホイール ---------- */
const ptrs = new Map();
let target = null, start = null, pinch = null;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * S.W, y: (e.clientY - r.top) / r.height * S.H };
}
function hitCal(p) {
  const b = S.calBox; return !!(S.cal.show && b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dist = () => { const a = [...ptrs.values()]; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1; };
const getScale = () => target === 'cal' ? S.cal.size : S.photo.scale;
function setScale(v) {
  if (target === 'cal') S.cal.size = clamp(v, .4, 2.5); else S.photo.scale = clamp(v, .2, 4);
  syncUI();
}

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    const p = toCanvas(e); target = hitCal(p) ? 'cal' : 'photo';
    const o = target === 'cal' ? S.cal : S.photo;
    start = { px: p.x, py: p.y, ox: o.x, oy: o.y };
    dragging = true; snapG = { xs: [], ys: [] }; cv.classList.add('dragging');
  } else if (ptrs.size === 2) {
    pinch = { d: dist(), s: getScale() }; start = null;
  }
  schedule();
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinch) { setScale(pinch.s * dist() / pinch.d); schedule(); }
  else if (ptrs.size === 1 && start) {
    const p = toCanvas(e), o = target === 'cal' ? S.cal : S.photo;
    o.x = start.ox + (p.x - start.px) / S.W; o.y = start.oy + (p.y - start.py) / S.H;
    snapG = { xs: [], ys: [] };
    if (S.snap) snapTo(o, 14 * S.W / cv.getBoundingClientRect().width);
    schedule();
  }
});
const endPtr = e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) { start = null; target = null; dragging = false; snapG = { xs: [], ys: [] }; cv.classList.remove('dragging'); }
  else if (ptrs.size === 1) start = null;
  schedule();
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  target = hitCal(toCanvas(e)) ? 'cal' : 'photo';
  setScale(getScale() * Math.exp(-e.deltaY * .0012)); target = null; schedule();
}, { passive: false });

/* ---------- 保存 ---------- */
let dl = null;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(x => { dl = x || null; }).catch(() => { dl = null; });
}
function showOverlay(img) {
  $('#outImg').src = img.toDataURL('image/png');
  $('#overlay').classList.add('open'); $('#closeOv').focus();
}
$('#closeOv').addEventListener('click', () => $('#overlay').classList.remove('open'));
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') $('#overlay').classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#overlay').classList.remove('open'); $('#fs').classList.remove('open'); } });

function download(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
$('#save').addEventListener('click', async () => {
  const img = finalImage();
  const name = `1bit-calendar-${S.cal.year}-${String(S.cal.month + 1).padStart(2, '0')}.png`;
  msg.textContent = '';
  try {
    const blob = await new Promise(r => img.toBlob(r, 'image/png'));
    if (!blob) throw new Error('toBlob');
    if (dl) await dl.save({ filename: name, data: blob });
    else download(blob, name);
  } catch (err) {
    if (err && err.code === 'declined') msg.textContent = '保存をキャンセルしました。';
    else showOverlay(img);
  }
});

/* ---------- 色の計算 ---------- */
function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0), f(8), f(4)].map(v => Math.round(v * 255));
}
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, s * 100, l * 100];
}
const toHex = rgb => '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');
const lum = rgb => {
  const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f(rgb[0]) + .7152 * f(rgb[1]) + .0722 * f(rgb[2]);
};
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
$('#swapColors').addEventListener('click', () => { const h = S.hsl; setColors(S.color.paper, S.color.ink); S.hsl = { ink: h.paper, paper: h.ink }; syncUI(); schedule(); });

/* ---------- サイトの色をパレットに合わせる ---------- */
function applyTheme() {
  const bg = hex(S.color.paper), ink = hex(S.color.ink);
  const [h, s, l] = rgb2hsl(ink[0], ink[1], ink[2]);
  let fg = ink;
  if (ratio(fg, bg) < 3) {
    const lighter = lum(bg) < .18; let ll = l;
    for (let i = 0; i < 60; i++) {
      ll = clamp(ll + (lighter ? 2 : -2), 0, 100);
      fg = hsl2rgb(h, s, ll);
      if (ratio(fg, bg) >= 3 || ll <= 0 || ll >= 100) break;
    }
  }
  const st = document.documentElement.style;
  st.setProperty('--bg', toHex(bg)); st.setProperty('--fg', toHex(fg));
  st.setProperty('--panel', toHex(bg)); st.setProperty('--mute', toHex(fg));
  st.setProperty('--on-fg', toHex(bg));
  st.setProperty('--ink', toHex(fg)); st.setProperty('--paper', toHex(bg));
}

/* ---------- 辺のスナップ(カレンダーと写真) ---------- */
function clampCalPos(bw, bh, sh) {
  const loX = bw / 2 / S.W, hiX = 1 - (bw / 2 + sh) / S.W;
  const loY = bh / 2 / S.H, hiY = 1 - (bh / 2 + sh) / S.H;
  S.cal.x = loX > hiX ? .5 : clamp(S.cal.x, loX, hiX);
  S.cal.y = loY > hiY ? .5 : clamp(S.cal.y, loY, hiY);
}
function photoRect() {
  const w = S.W * S.photo.scale, h = w * S.src.height / S.src.width;
  return { x: S.photo.x * S.W - w / 2, y: S.photo.y * S.H - h / 2, w, h };
}
// スナップ: 動かしている側の辺が、もう一方の4辺に吸着する。
// ガイドONのときは、中央のガイド線にも辺・中心が吸着する。
function snapTo(o, thr) {
  const isCal = target === 'cal';
  if (isCal && !S.calRect) return;
  const R = isCal
    ? { x: o.x * S.W - S.calRect.w / 2, y: o.y * S.H - S.calRect.h / 2, w: S.calRect.w, h: S.calRect.h }
    : photoRect();
  const O = isCal ? photoRect() : S.calRect;
  const axis = (lo, size, olo, osize, mid) => {
    let b = null;
    const add = (at, p) => { const d = at - p; if (Math.abs(d) < thr && (!b || Math.abs(d) < Math.abs(b.d))) b = { d, at }; };
    if (O) for (const at of [olo, olo + osize]) { add(at, lo); add(at, lo + size); }
    if (S.guide) { add(mid, lo); add(mid, lo + size / 2); add(mid, lo + size); }
    return b;
  };
  const bx = axis(R.x, R.w, O && O.x, O && O.w, S.W / 2);
  if (bx) { o.x += bx.d / S.W; snapG.xs.push(bx.at); }
  const by = axis(R.y, R.h, O && O.y, O && O.h, S.H / 2);
  if (by) { o.y += by.d / S.H; snapG.ys.push(by.at); }
}

/* ---------- トリミング ---------- */
const crop = { rect: null, asp: 'free', k: 1, dpr: 1, drag: null };
const cropCv = $('#cropCv'), cctx = cropCv.getContext('2d');
function aspValue() {
  if (crop.asp === 'free') return null;
  if (crop.asp === 'screen') return S.W / S.H;
  return +crop.asp;
}
function updateAspUI() {
  document.querySelectorAll('#cropAsp button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.asp === crop.asp)));
}
function fitRectToAspect() {
  const a = aspValue(); if (!a) return;
  const iw = S.orig.width, ih = S.orig.height, r = crop.rect;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  let w = r.w, h = w / a;
  if (h > ih) { h = ih; w = h * a; }
  if (w > iw) { w = iw; h = w / a; }
  crop.rect = { x: clamp(cx - w / 2, 0, iw - w), y: clamp(cy - h / 2, 0, ih - h), w, h };
}
function cropLayout() {
  const st = $('#cropStage').getBoundingClientRect();
  const iw = S.orig.width, ih = S.orig.height;
  crop.k = Math.min((st.width - 8) / iw, (st.height - 8) / ih);
  crop.dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(iw * crop.k)), ch = Math.max(1, Math.floor(ih * crop.k));
  cropCv.style.width = cw + 'px'; cropCv.style.height = ch + 'px';
  cropCv.width = Math.round(cw * crop.dpr); cropCv.height = Math.round(ch * crop.dpr);
  drawCrop();
}
function cropHandles() {
  const r = crop.rect, k = crop.k, x = r.x * k, y = r.y * k, w = r.w * k, h = r.h * k;
  const hs = [['nw', x, y], ['ne', x + w, y], ['sw', x, y + h], ['se', x + w, y + h]];
  if (!aspValue()) hs.push(['n', x + w / 2, y], ['s', x + w / 2, y + h], ['w', x, y + h / 2], ['e', x + w, y + h / 2]);
  return hs;
}
function drawCrop() {
  const cw = cropCv.width / crop.dpr, ch = cropCv.height / crop.dpr, k = crop.k, r = crop.rect;
  cctx.setTransform(crop.dpr, 0, 0, crop.dpr, 0, 0);
  cctx.clearRect(0, 0, cw, ch);
  cctx.drawImage(S.orig, 0, 0, cw, ch);
  const x = r.x * k, y = r.y * k, w = r.w * k, h = r.h * k;
  // 枠の外は背景の色の網点で覆う(半透明は使わない)
  const pc = document.createElement('canvas'); pc.width = pc.height = 2;
  const pg = pc.getContext('2d'); pg.fillStyle = S.color.paper; pg.fillRect(0, 0, 1, 1); pg.fillRect(1, 1, 1, 1);
  const pat = cctx.createPattern(pc, 'repeat'); pat.setTransform(new DOMMatrix().scale(1 / crop.dpr));
  cctx.fillStyle = pat;
  cctx.fillRect(0, 0, cw, y); cctx.fillRect(0, y + h, cw, ch - y - h);
  cctx.fillRect(0, y, x, h); cctx.fillRect(x + w, y, cw - x - w, h);
  dashLine(cctx, 1, [4, 4], () => {
    cctx.beginPath();
    for (let i = 1; i < 3; i++) {
      cctx.moveTo(x + w * i / 3, y); cctx.lineTo(x + w * i / 3, y + h);
      cctx.moveTo(x, y + h * i / 3); cctx.lineTo(x + w, y + h * i / 3);
    }
  });
  dashLine(cctx, 2, [6, 6], () => { cctx.beginPath(); cctx.rect(x, y, w, h); });
  cropHandles().forEach(p => {
    cctx.fillStyle = S.color.paper; cctx.fillRect(p[1] - 7, p[2] - 7, 14, 14);
    cctx.strokeStyle = S.color.ink; cctx.lineWidth = 2; cctx.strokeRect(p[1] - 6, p[2] - 6, 12, 12);
  });
}
function openCrop() {
  const iw = S.orig.width, ih = S.orig.height;
  crop.rect = S.crop ? { ...S.crop } : { x: 0, y: 0, w: iw, h: ih };
  crop.asp = 'free'; crop.drag = null; updateAspUI();
  $('#crop').classList.add('open');
  cropLayout();
}
function closeCrop() { $('#crop').classList.remove('open'); crop.drag = null; }
function applyCrop() {
  const r = crop.rect, c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(r.w)); c.height = Math.max(1, Math.round(r.h));
  c.getContext('2d').drawImage(S.orig, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
  const full = r.w >= S.orig.width - 1 && r.h >= S.orig.height - 1;
  S.src = full ? S.orig : c; S.crop = full ? null : { ...r };
  autoPlace(); closeCrop(); syncUI(); schedule();
}
const cropPos = e => { const b = cropCv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
cropCv.addEventListener('pointerdown', e => {
  cropCv.setPointerCapture(e.pointerId);
  const p = cropPos(e), r = crop.rect, k = crop.k;
  let mode = null, best = 26;
  cropHandles().forEach(h => { const d = Math.hypot(p.x - h[1], p.y - h[2]); if (d < best) { best = d; mode = h[0]; } });
  if (!mode && p.x >= r.x * k && p.x <= (r.x + r.w) * k && p.y >= r.y * k && p.y <= (r.y + r.h) * k) mode = 'move';
  if (mode) crop.drag = { mode, sx: p.x, sy: p.y, r: { ...r } };
});
cropCv.addEventListener('pointermove', e => {
  const d = crop.drag; if (!d) return;
  const p = cropPos(e), k = crop.k, iw = S.orig.width, ih = S.orig.height, s = d.r;
  const dx = (p.x - d.sx) / k, dy = (p.y - d.sy) / k, min = Math.max(16, 24 / k);
  if (d.mode === 'move') {
    crop.rect = { x: clamp(s.x + dx, 0, iw - s.w), y: clamp(s.y + dy, 0, ih - s.h), w: s.w, h: s.h };
  } else if (!aspValue()) {
    let x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
    if (d.mode.includes('w')) x1 = clamp(s.x + dx, 0, x2 - min);
    if (d.mode.includes('e')) x2 = clamp(s.x + s.w + dx, x1 + min, iw);
    if (d.mode.includes('n')) y1 = clamp(s.y + dy, 0, y2 - min);
    if (d.mode.includes('s')) y2 = clamp(s.y + s.h + dy, y1 + min, ih);
    crop.rect = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  } else {
    const a = aspValue(), W = d.mode.includes('w'), N = d.mode.includes('n');
    const ax = W ? s.x + s.w : s.x, ay = N ? s.y + s.h : s.y;
    const nx = (W ? s.x : s.x + s.w) + dx, ny = (N ? s.y : s.y + s.h) + dy;
    let w = Math.abs(nx - ax), h = Math.abs(ny - ay);
    if (w / a > h) h = w / a; else w = h * a;
    const maxW = W ? ax : iw - ax, maxH = N ? ay : ih - ay;
    const f = Math.min(1, maxW / w, maxH / h); w *= f; h *= f;
    if (w < min) { w = min; h = w / a; }
    crop.rect = { x: W ? ax - w : ax, y: N ? ay - h : ay, w, h };
  }
  drawCrop();
});
const endCropDrag = () => { crop.drag = null; };
cropCv.addEventListener('pointerup', endCropDrag);
cropCv.addEventListener('pointercancel', endCropDrag);
document.querySelectorAll('#cropAsp button').forEach(b => b.addEventListener('click', () => {
  crop.asp = b.dataset.asp; updateAspUI(); fitRectToAspect(); drawCrop();
}));
$('#cropOpen').addEventListener('click', openCrop);
$('#cropCancel').addEventListener('click', closeCrop);
$('#cropApply').addEventListener('click', applyCrop);
$('#cropFull').addEventListener('click', () => {
  crop.rect = { x: 0, y: 0, w: S.orig.width, h: S.orig.height }; fitRectToAspect(); drawCrop();
});
$('#cropReset').addEventListener('click', () => {
  S.src = S.orig; S.crop = null; autoPlace(); syncUI(); schedule();
});
window.addEventListener('resize', () => { if ($('#crop').classList.contains('open')) cropLayout(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCrop(); });

/* ---------- 全画面表示 ---------- */
const fs = $('#fs'), fsCv = $('#fsCv');
function openFs() {
  fsCv.width = S.W; fsCv.height = S.H;
  fsCv.getContext('2d').drawImage(finalImage(), 0, 0);
  fs.classList.add('open');
  if (fs.requestFullscreen) fs.requestFullscreen().catch(() => {});
}
function closeFs() {
  fs.classList.remove('open');
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
$('#fsOpen').addEventListener('click', openFs);
fs.addEventListener('click', closeFs);
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) fs.classList.remove('open'); });

/* ---------- 起動 ---------- */
S.src = makeSample(); S.orig = S.src; S.crop = null;
syncUI(); fit(); render(true);
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe($('#cvbox'));
if (document.fonts && document.fonts.load) {
  document.fonts.load(`16px "DotGothic16"`, '0123456789年月日火水木金土SMTWFJANUARYBCDEGHILOPRV').then(() => schedule()).catch(() => {});
  document.fonts.ready.then(() => schedule());
}
})();
</script>
