<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>1bit Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=VT323&family=Space+Mono&family=Shippori+Mincho&family=Dela+Gothic+One&family=Yusei+Magic&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>1bit Calendar</h1>
      <div class="hdr">
        <button type="button" id="langSw">EN</button>
        <button type="button" id="sound" aria-pressed="true" aria-label="音" title="音">
          <svg class="ico" data-ico="sndOn" aria-hidden="true"></svg>
        </button>
      </div>
    </header>
    <button class="btn" id="resetColors" type="button">COLOR RESET</button>

    <main class="app">
      <section class="stage" id="stage" aria-label="プレビュー">
        <div class="cvbox" id="cvbox">
          <label class="sizebox">
            <span id="sizeLabel" aria-hidden="true"></span>
            <select id="size" aria-label="画像のサイズ">
              <option value="1179x2556">iPhone 1179×2556</option>
              <option value="1290x2796">iPhone Pro Max 1290×2796</option>
              <option value="1080x2400">Android 1080×2400</option>
              <option value="1640x2360">iPad 1640×2360</option>
              <option value="1920x1080">PC 1920×1080</option>
              <option value="1080x1080">正方形 1080×1080</option>
            </select>
          </label>
          <canvas
            id="cv"
            width="1179"
            height="2556"
            role="img"
            aria-label="壁紙のプレビュー。ドラッグで写真やカレンダーを動かせます"
          ></canvas>
        </div>
        <div class="tools">
          <div class="seg" role="group" aria-label="プレビューの設定">
            <button type="button" class="tog" id="guide" aria-pressed="false">ガイド</button>
            <button type="button" class="tog" id="snap" aria-pressed="true">スナップ</button>
          </div>
          <button class="btn" id="fsOpen" type="button">全画面</button>
          <button class="btn primary" id="save" type="button">
            <svg class="ico" data-ico="out" aria-hidden="true"></svg>
            保存
          </button>
        </div>
      </section>

      <section class="panel">
        <div class="tabs" role="tablist">
          <button role="tab" id="t-photo" aria-selected="true" aria-controls="pane-photo" data-tab="photo">
            <svg class="ico" data-ico="photo" aria-hidden="true"></svg>
            写真
          </button>
          <button role="tab" id="t-cal" aria-selected="false" aria-controls="pane-cal" data-tab="cal">
            <svg class="ico" data-ico="cal" aria-hidden="true"></svg>
            カレンダー
          </button>
          <button role="tab" id="t-color" aria-selected="false" aria-controls="pane-color" data-tab="color">
            <svg class="ico" data-ico="color" aria-hidden="true"></svg>
            色
          </button>
        </div>

        <div class="panes">
          <!-- 写真 -->
          <div class="pane" id="pane-photo" role="tabpanel" aria-labelledby="t-photo">
            <div>
              <input type="file" id="file" accept="image/*" hidden />
              <button class="btn primary wide" id="pick" type="button">写真を選ぶ</button>
            </div>
            <p id="msg" role="status" aria-live="polite"></p>
            <div class="two" id="cropBtns">
              <button class="btn" id="cropOpen" type="button">トリミング</button>
              <button class="btn" id="cropReset" type="button">トリミング解除</button>
            </div>
            <div class="row">
              <label for="algo">ドットの模様</label>
              <select id="algo">
                <option value="b2">格子(粗い)</option>
                <option value="b4" selected>格子</option>
                <option value="b8">格子(細かい)</option>
                <option value="fs">砂目</option>
                <option value="at">砂目(くっきり)</option>
                <option value="th">白黒のみ</option>
              </select>
            </div>
            <div class="row">
              <div class="top">
                <label for="px">ドットの大きさ</label>
                <span class="val" id="v-px"></span>
              </div>
              <input type="range" id="px" min="1" max="16" step="1" />
            </div>
            <div class="row">
              <div class="top">
                <label for="bright">明るさ</label>
                <span class="val" id="v-bright"></span>
              </div>
              <input type="range" id="bright" min="-100" max="100" step="1" />
            </div>
            <div class="row">
              <div class="top">
                <label for="contrast">コントラスト</label>
                <span class="val" id="v-contrast"></span>
              </div>
              <input type="range" id="contrast" min="-100" max="100" step="1" />
            </div>
            <div class="row">
              <div class="top">
                <label for="pscale">写真の大きさ</label>
                <span class="val" id="v-pscale"></span>
              </div>
              <input type="range" id="pscale" min="0.2" max="4" step="0.01" />
            </div>
            <label class="check">
              <input type="checkbox" id="invert" />
              明暗を反転する
            </label>
            <button class="btn wide" id="resetPhoto" type="button">写真の位置をリセット</button>
          </div>

          <!-- カレンダー -->
          <div class="pane" id="pane-cal" role="tabpanel" aria-labelledby="t-cal" hidden>
            <label class="check">
              <input type="checkbox" id="calShow" />
              カレンダーを表示する
            </label>
            <div class="monthbar">
              <button class="btn" id="prevM" type="button" aria-label="前の月">&lt;</button>
              <div class="lbl" id="monthLabel" aria-live="polite"></div>
              <button class="btn" id="nextM" type="button" aria-label="次の月">&gt;</button>
            </div>
            <button class="btn wide" id="thisM" type="button">今月にする</button>
            <div class="row">
              <label for="calStyle">レイアウト</label>
              <select id="calStyle">
                <option value="grid">グリッド</option>
                <option value="list">縦リスト</option>
                <option value="list2">2列リスト</option>
                <option value="transpose">縦横入れ替え</option>
                <option value="bigmonth">ビッグ月</option>
                <option value="strip">1行</option>
                <option value="plain">数字のみ</option>
              </select>
            </div>
            <div class="row">
              <label for="calFont">フォント</label>
              <select id="calFont">
                <option value="DotGothic16">ドット(ドットゴシック)</option>
                <option value="Press Start 2P">ピクセル(英数字)</option>
                <option value="VT323">ターミナル</option>
                <option value="Space Mono">等幅</option>
                <option value="Shippori Mincho">明朝</option>
                <option value="Dela Gothic One">極太ゴシック</option>
                <option value="Yusei Magic">手書き</option>
              </select>
            </div>
            <div class="two">
              <div class="row">
                <label for="calWeek">週の始まり</label>
                <select id="calWeek">
                  <option value="0">日曜</option>
                  <option value="1">月曜</option>
                </select>
              </div>
              <div class="row">
                <label for="calLang">言語</label>
                <select id="calLang">
                  <option value="ja">日本語</option>
                  <option value="en">English</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="top">
                <label for="calSize">カレンダーの大きさ</label>
                <span class="val" id="v-calSize"></span>
              </div>
              <input type="range" id="calSize" min="0.4" max="2.5" step="0.01" />
            </div>
            <label class="check">
              <input type="checkbox" id="calFrame" />
              枠をつける
            </label>
            <label class="check">
              <input type="checkbox" id="calBg" />
              背景をつける
            </label>
            <button class="btn wide" id="resetCal" type="button">カレンダーの位置をリセット</button>
          </div>

          <!-- 色 -->
          <div class="pane" id="pane-color" role="tabpanel" aria-labelledby="t-color" hidden>
            <div class="swatches" id="swatches"></div>
            <button class="btn wide" id="swapColors" type="button">ドットと背景を入れ替え</button>
            <div class="sec hd">
              <label for="hex-ink">ドットの色</label>
              <input
                class="hex"
                id="hex-ink"
                data-hex="ink"
                type="text"
                maxlength="7"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
              />
            </div>
            <div class="row">
              <div class="top">
                <label for="ink-h">色相</label>
                <span class="val" id="v-ink-h"></span>
              </div>
              <input type="range" id="ink-h" data-c="ink" data-i="0" min="0" max="359" step="1" />
            </div>
            <div class="row">
              <div class="top">
                <label for="ink-s">鮮やかさ</label>
                <span class="val" id="v-ink-s"></span>
              </div>
              <input type="range" id="ink-s" data-c="ink" data-i="1" min="0" max="100" step="1" />
            </div>
            <div class="row">
              <div class="top">
                <label for="ink-l">明るさ</label>
                <span class="val" id="v-ink-l"></span>
              </div>
              <input type="range" id="ink-l" data-c="ink" data-i="2" min="0" max="100" step="1" />
            </div>
            <div class="sec hd">
              <label for="hex-paper">背景の色</label>
              <input
                class="hex"
                id="hex-paper"
                data-hex="paper"
                type="text"
                maxlength="7"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
              />
            </div>
            <div class="row">
              <div class="top">
                <label for="paper-h">色相</label>
                <span class="val" id="v-paper-h"></span>
              </div>
              <input type="range" id="paper-h" data-c="paper" data-i="0" min="0" max="359" step="1" />
            </div>
            <div class="row">
              <div class="top">
                <label for="paper-s">鮮やかさ</label>
                <span class="val" id="v-paper-s"></span>
              </div>
              <input type="range" id="paper-s" data-c="paper" data-i="1" min="0" max="100" step="1" />
            </div>
            <div class="row">
              <div class="top">
                <label for="paper-l">明るさ</label>
                <span class="val" id="v-paper-l"></span>
              </div>
              <input type="range" id="paper-l" data-c="paper" data-i="2" min="0" max="100" step="1" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="crop" role="dialog" aria-modal="true" aria-label="写真をトリミング">
      <div class="seg" id="cropAsp" role="group" aria-label="縦横比">
        <button type="button" data-asp="free" aria-pressed="true">自由</button>
        <button type="button" data-asp="1" aria-pressed="false">1:1</button>
        <button type="button" data-asp="0.75" aria-pressed="false">3:4</button>
        <button type="button" data-asp="0.5625" aria-pressed="false">9:16</button>
        <button type="button" data-asp="screen" aria-pressed="false">画面</button>
      </div>
      <div class="cropstage" id="cropStage"><canvas id="cropCv"></canvas></div>
      <div class="cropbtns">
        <button class="btn" id="cropCancel" type="button">キャンセル</button>
        <button class="btn" id="cropFull" type="button">全体</button>
        <button class="btn primary" id="cropApply" type="button">適用</button>
      </div>
    </div>

    <div id="fs" role="dialog" aria-modal="true" aria-label="壁紙の全画面表示">
      <canvas id="fsCv"></canvas>
      <button class="btn" id="fsClose" type="button">閉じる</button>
    </div>

    <div id="overlay" role="dialog" aria-modal="true" aria-label="画像を保存">
      <div class="card">
        <img id="outImg" alt="書き出した壁紙" />
        <p class="note">画像を長押し(PCは右クリック)して保存できます。</p>
        <button class="btn wide" id="closeOv" type="button">閉じる</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
